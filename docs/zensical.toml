[project]
site_name = "Crystalith"

# Relative to this file (docs/)
docs_dir = "doc"
site_dir = "site"

plugins = ["search"]

nav = [
  { "首页" = "index.md" },
  { "快速上手" = "getting-started.md" },
  { "最佳配置" = "optimal-config.md" },
  { "部署与开发" = "deployment.md" },
  { "运维手册" = "operations.md" },
  { "Python SDK" = "sdk-python.md" },
  { "TypeScript SDK" = "sdk-typescript.md" },
  { "Go SDK" = "sdk-go.md" },
  { "Rust SDK" = "sdk-rust.md" },
  { "插件" = "plugins.md" },
  { "证据链" = "evidence-chain.md" },
  { "配置" = "configuration.md" },
  { "参考" = [
    { "配置 Schema（生成）" = "reference/config-schema.gen.md" },
    { "环境变量（生成）" = "reference/env-vars.gen.md" },
    { "官方插件（生成）" = "reference/plugins.gen.md" },
  ] },
  { "贡献指南" = "contributing.md" },
]

[project.theme]
variant = "modern"
logo = "static/logo.webp"
features = [
  "navigation.sections",
  "navigation.expand",
  "content.code.copy",
]
