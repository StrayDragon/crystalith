# yaml-language-server: $schema=./app.schema.gen.json
# ============================================================================
# Crystalith Configuration (safe defaults for public repo)
# ============================================================================
# Notes:
# - Do NOT commit secrets. Export CL_* keys in your shell or set in `.env` (gitignored).
# - This file is rendered as a template before YAML parsing; `env.KEY`-style
#   expressions read from os.environ overlaid by `.env`.
# - The legacy `secret.*` namespace (config/secret.env) was removed and throws.
%YAML 1.1
---
# ----------------------------------------------------------------------------
# Metadata
# ----------------------------------------------------------------------------
name: "Crystalith"
version: "1.0.0"
schema: v1

# ----------------------------------------------------------------------------
# App / web server
# ----------------------------------------------------------------------------
app:
  features:
    # Enables interactive output renderers (frontend bundle loading) in the web UI.
    # Set to false to force fallback rendering (GenericOutputRenderer / raw JSON).
    workspace_frontend_bundles_enabled: true

  auth:
    # Optional API key auth for self-host deployments.
    # When enabled, all /v1/** endpoints require `Authorization: Bearer <token>`.
    enabled: false
    # api_key: "env.CRYSTALITH_API_KEY" (template-rendered)

  cors:
    # Allowed origins for browser clients (CORS).
    # Keep this list tight in production.
    allow_origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:8080"
      - "http://127.0.0.1:8080"

  startup:
    # If true, automatically runs DB migrations on startup.
    # Recommended for local/dev; for production, prefer controlled migrations.
    auto_db_init: true
    # If true, deletes sources with status=failed on backend startup.
    # WARNING: This removes DB rows and may orphan related files/vectors.
    cleanup_failed_sources: false

# ----------------------------------------------------------------------------
# Plugin discovery (CrystalithPlugin registry)
# ----------------------------------------------------------------------------
# Built-in plugins register in-box; external plugins are npm packages under
# the `@crystalith-plugin/*` scope, loaded at startup (restart to apply).
#
# Tips:
# - `enabled` (allowlist) overrides default enablement (only listed ids load).
# - `disabled` (denylist) always takes precedence.
# - `load_order` makes conflict resolution deterministic (loaded last wins).
plugins:
  # enabled: ["extractor-jina", "slides-slidev"]
  disabled: []
  # 试用：arxiv 提取器排在 fallback 链首（非 arxiv URL 空内容自动降级，无副作用）
  load_order: ["extractor-arxiv"]

# ----------------------------------------------------------------------------
# Providers (use YAML anchors for reuse)
# ----------------------------------------------------------------------------
providers:
  # OpenAI-compatible API (general-purpose: chat, embeddings via external API)
  openai_default: &openai_default
    apiKey: "{{ env.CL_CHAT_API_KEY | default('') }}"
    baseUrl: "{{ env.CL_CHAT_API_BASE | default('http://127.0.0.1:50256/v1') }}"

  # OpenAI-compatible embedding gateway (dedicated embedding server, e.g. OMLX)
  embed_gateway: &embed_gateway
    apiKey: "{{ env.CL_EMBEDDING_API_KEY | default('sk-local') }}"
    baseUrl: "{{ env.CL_EMBEDDING_API_BASE | default('http://127.0.0.1:50256/v1') }}"

  # OpenAI-compatible primary chat gateway (routed via CL_CHAT_API_BASE by default)
  # Default false: some think/grammar gateways reject json_schema ("failed to parse grammar").
  # gateway-chat-primary overrides to true when the gateway supports response_format json_schema
  # (required for Studio structured outputs — MINDMAP/TIMELINE/etc.).
  chat_gateway: &chat_gateway
    apiKey: "{{ env.CL_CHAT_API_KEY | default('sk-local') }}"
    baseUrl: "{{ env.CL_CHAT_API_BASE | default('http://127.0.0.1:50256/v1') }}"
    supportsStructuredOutputs: false

# ----------------------------------------------------------------------------
# Models (required)
# ----------------------------------------------------------------------------
models:
  defaults:
    # Default chat model ID (override: CL_DEFAULT_CHAT_MODEL=gateway-chat-light)
    chat: "{{ env.CL_DEFAULT_CHAT_MODEL | default('gateway-chat-primary') }}"
    # Default embedding model ID
    embedding: "{{ env.CL_DEFAULT_EMBEDDING_MODEL | default('gateway-embedding') }}"

  available:
    # -------------------- OpenAI (chat) --------------------
    - id: "deepseek-chat"
      provider: "openai"
      model: "deepseek-chat"
      displayName: "DeepSeek Chat"
      description: "DeepSeek chat model"
      roles: [chat, edit]
      capabilities: [tool_use]
      providerConfig:
        <<: *openai_default
      completionOptions:
        temperature: 0.7
        maxTokens: 4096

    # -------------------- OpenAI-compatible gateway (chat) --------------------
    # NOTE: @ai-sdk/openai v4 uses Responses API by default. Many local
    # gateways (llama.cpp, OMLX, ...) only support Chat Completions API, so
    # they use 'openai-compatible' provider (createOpenAICompatible).
    - id: "deepseek-chat-via-gateway"
      provider: "openai-compatible"
      model: "deepseek-chat"
      displayName: "DeepSeek Chat (gateway)"
      description: "DeepSeek chat via OpenAI-compatible gateway (Chat Completions API)"
      roles: [chat, edit]
      capabilities: [tool_use]
      providerConfig:
        <<: *chat_gateway

    # -------------------- OpenAI (embedding) --------------------
    - id: "text-embedding-3-small"
      provider: "openai"
      model: "text-embedding-3-small"
      displayName: "text-embedding-3-small"
      description: "OpenAI embedding model"
      roles: [embed]
      providerConfig:
        <<: *openai_default

    # -------------------- OpenAI-compatible gateway (embedding) --------------------
    # NOTE: These model ids are commonly provided by OpenAI-compatible gateways (not by api.openai.com).
    - id: "bge-m3-openai"
      provider: "openai"
      model: "BAAI/bge-m3"
      displayName: "BGE-M3 (gateway)"
      description: "Embedding model via OpenAI-compatible gateway"
      roles: [embed]
      providerConfig:
        <<: *openai_default

    - id: "qwen3-embedding-openai"
      provider: "openai"
      model: "Qwen/Qwen3-Embedding-8B"
      displayName: "Qwen3 Embedding 8B (gateway)"
      description: "Embedding model via OpenAI-compatible gateway"
      roles: [embed]
      providerConfig:
        <<: *openai_default

    # -------------------- OpenAI-compatible gateways (env-driven) --------------------
    - id: "gateway-embedding"
      # Local/OpenAI-compatible gateways (OMLX, llamacpp --embeddings, etc.)
      provider: "openai-compatible"
      model: "{{ env.CL_EMBEDDING_MODEL | default('bge-m3-mlx-8bit') }}"
      displayName: "Gateway Embedding"
      description: "Embedding via OpenAI-compatible gateway"
      roles: [embed]
      providerConfig:
        <<: *embed_gateway

    - id: "gateway-chat-light"
      provider: "openai-compatible"
      model: "{{ env.CL_CHAT_LIGHT_MODEL | default('Qwen3.5-0.8B-MLX-bf16') }}"
      displayName: "Gateway Chat (light)"
      description: "Lightweight chat via OpenAI-compatible gateway"
      roles: [chat, edit]
      capabilities: [tool_use]
      providerConfig:
        <<: *embed_gateway
      completionOptions:
        temperature: 0.7
        maxTokens: 4096

    - id: "gateway-chat-primary"
      provider: "openai-compatible"
      model: "{{ env.CL_CHAT_MODEL | default('NOT-SET') }}"
      displayName: "Gateway Chat (primary)"
      description: "Primary chat via OpenAI-compatible gateway"
      roles: [chat, edit]
      capabilities: [tool_use]
      providerConfig:
        <<: *chat_gateway
        supportsStructuredOutputs: true
      completionOptions:
        temperature: 0.7
        maxTokens: 8192

# ----------------------------------------------------------------------------
# Feature settings
# ----------------------------------------------------------------------------
embedding:
  chunk_size: 512
  batch_size: 32

# ----------------------------------------------------------------------------
# Concurrency guardrails (safe defaults)
# ----------------------------------------------------------------------------
# Applies to key I/O phases:
# - embedding: retrieval/qa/refine embedding calls
# - vector_search: vector DB search calls
# - llm_generate: chat/completions (including streaming) calls
#
# Set to 0 to disable a limiter.
concurrency:
  embedding: 8
  vector_search: 8
  llm_generate: 4

# ----------------------------------------------------------------------------
# Storage
# ----------------------------------------------------------------------------
# v2: Unified data root for all runtime files (DB, slides, uploads, etc.).
# Override via CL_DATA_ROOT env var.  Relative paths resolve from CWD.
storage:
  data_root: "./data"

database:
  # v1-compat passthrough only — v2 runtime does NOT read this (DB path comes
  # from CL_DB_PATH / storage.data_root). Kept so old app.yaml files still parse.
  url: "sqlite+aiosqlite:///./data/app.db"

cache:
  # memory|auto. auto selects a reachable redis if configured, else falls back to memory.
  # (redis_url_candidates removed — set explicitly if Redis is needed)
  provider: "memory"
  ttl: 60
  max_size: 2048

# ----------------------------------------------------------------------------
# Context window
# ----------------------------------------------------------------------------
context_window:
  max_tokens: 8000
  compression_strategy: "truncate"
  window_size: 10
  priority:
    - history
    - retrieval
    - recent
    - system

# ----------------------------------------------------------------------------
# Search engine (optional) — SSOT for web search AND /health/dependencies SearXNG
# ----------------------------------------------------------------------------
search:
  searxng:
    # Instance URL. Set via CL_SEARXNG_HOST (recommended: repo-root `.env`).
    # Empty host disables web search and marks SearXNG as disabled in diagnostics.
    host: "{{ env.CL_SEARXNG_HOST | default('') }}"
    # Milliseconds. 300s allows slow SearXNG / remote engines to return.
    timeout: 300000
    max_results: 10

# ----------------------------------------------------------------------------
# Optional service contracts (core remains available when these are unavailable)
# SearXNG is NOT configured here. Diagnostics + searchWeb both use
# search.searxng.host / getSearxngHost() (CL_SEARXNG_HOST). Legacy
# optional_services.searxng.{enabled,endpoint,timeout_s} keys are ignored.
# ----------------------------------------------------------------------------
optional_services: {}

# ----------------------------------------------------------------------------
# Proxy settings (YAML anchor for optional reuse)
# Outbound non-LLM HTTP (search / URL fetch / extractors) reads this via
# apps/server/src/shared/net/outbound-fetch.ts. socks5_url is ignored for now.
# LLM / embedding providers do NOT use this by default (c109).
# Env overrides: CL_PROXY_ENABLED ('true'/'false'), CL_PROXY_HTTP_URL,
# CL_PROXY_HTTPS_URL (unset/empty keeps the values below).
# ----------------------------------------------------------------------------
proxy_settings: &default_proxy
  enabled: true
  http_url: "http://127.0.0.1:20171"
  https_url: "http://127.0.0.1:20171"
  socks5_url: ""
  no_proxy:
    - localhost
    - "127.0.0.1"

# ----------------------------------------------------------------------------
# Source ingestion
# ----------------------------------------------------------------------------
source_ingestion:
  url_fetch:
    proxy:
      <<: *default_proxy
    timeout: 30
    retry_count: 2
    retry_delay: 1.0
    security:
      # SSRF protections for "source from URL" fetch mode.
      # Safe by default: blocks localhost/private networks/metadata IPs unless explicitly allowlisted.
      allowlist_hosts: []
      allowlist_domains: []
      allowlist_cidrs: []
      allowlist_only: false
      max_redirects: 5

  web_extraction:
    # v2 extractors: readability (built-in) / jina / firecrawl.
    # Availability = enabled && api_key present (readability needs neither).
    jina:
      enabled: true
      # Prefer CL_* (shell or .env) over deprecated JINA_API_KEY.
      api_key: "{{ env.CL_JINA_API_KEY | default(env.JINA_API_KEY | default('')) }}"

    firecrawl:
      # Availability still requires a non-empty api_key (CL_FIRECRAWL_API_KEY).
      enabled: true
      api_key: "{{ env.CL_FIRECRAWL_API_KEY | default(env.FIRECRAWL_API_KEY | default('')) }}"
      # Self-hosted: set CL_FIRECRAWL_API_BASE (e.g. http://127.0.0.1:3002). Empty → cloud default.
      base_url: "{{ env.CL_FIRECRAWL_API_BASE | default('') }}"

# ----------------------------------------------------------------------------
# Deep Research
# ----------------------------------------------------------------------------
research:
  # After a run reaches a terminal status, truncate progress_events to the
  # most recent N rows (by seq). In-flight runs keep the full ledger.
  progressEventRetain: 200
  # Max concurrent research-node work-units per Run (c106). 1 = serial drain;
  # default 2; Zod clamps to 1..8. Same-Run LLM calls stay serialized via queue.
  parallelBranchUnits: 2
  # Optional model id for topic auto-decompose (c93). Omit or leave empty to
  # inherit models.defaults.chat.
  # decomposeModelId: ""
  # Page-fetch budget = ceil(maxSearches * pageRatio) (c107). Independent of searches.
  pageRatio: 1.5
  # ToolLoopAgent work_unit step cap (c107).
  workUnitMaxSteps: 12
  # Per-node web evidence content token budget (c107).
  nodeContentTokenBudget: 32768
  # Node short-synthesis evidence context token budget (c107).
  nodeSummaryTokenBudget: 65536
  # Search budget add-on: K = clamp(ceil(maxSearches × addOnRatio), minK, maxK) (c108).
  addOnRatio: 0.25
  addOnMinK: 5
  addOnMaxK: 50
