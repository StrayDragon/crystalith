# yaml-language-server: $schema=./app.schema.gen.json
# ============================================================================
# Crystalith Configuration (safe defaults for public repo)
# ============================================================================
# Notes:
# - Do NOT commit secrets. Export them in your shell or set in `.env` (gitignored).
# - This file is rendered as a template before YAML parsing:
#   - `{% raw %}{{ env.KEY }}{% endraw %}` reads from `os.environ` overlaid by `.env`
#   - `{% raw %}{{ secret.KEY }}{% endraw %}` reads from `config/secret.env` (optional; Docker deployments)
%YAML 1.1
---
# ----------------------------------------------------------------------------
# Metadata
# ----------------------------------------------------------------------------
name: "Crystalith"
version: "1.0.0"
schema: v1

# ----------------------------------------------------------------------------
# App / web server
# ----------------------------------------------------------------------------
app:
  features:
    # Enables interactive output renderers (frontend bundle loading) in the web UI.
    # Set to false to force fallback rendering (GenericOutputRenderer / raw JSON).
    workspace_frontend_bundles_enabled: true

  auth:
    # Optional API key auth for self-host deployments.
    # When enabled, all /v1/** endpoints require `Authorization: Bearer <token>`.
    enabled: false
    # api_key: "{% raw %}{{ secret.CRYSTALITH_API_KEY }}{% endraw %}"

  cors:
    # Allowed origins for browser clients (CORS).
    # Keep this list tight in production.
    allow_origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:8080"
      - "http://127.0.0.1:8080"

  startup:
    # If true, automatically runs DB migrations on startup.
    # Recommended for local/dev; for production, prefer controlled migrations.
    auto_db_init: true
    # If true, deletes sources with status=failed on backend startup.
    # WARNING: This removes DB rows and may orphan related files/vectors.
    cleanup_failed_sources: false

# ----------------------------------------------------------------------------
# Plugins (Python entry points)
# ----------------------------------------------------------------------------
# Plugins are discovered via Python entry points (group: `crystalith.plugins`).
#
# Install profiles:
# - core-only: `pip install crystalith` (default docker image)
# - official-full (recommended): `pip install 'crystalith[official-full]'`
#
# Tips:
# - `enabled` (allowlist) overrides default enablement (only listed ids load).
# - `disabled` (denylist) always takes precedence.
# - `load_order` makes conflict resolution deterministic (loaded last wins).
plugins:
  # enabled: ["output-faq", "parser-pdf", "extractor-trafilatura"]
  disabled: []
  load_order: []

# ----------------------------------------------------------------------------
# Providers (use YAML anchors for reuse)
# ----------------------------------------------------------------------------
providers:
  # OpenAI-compatible API
  openai_default: &openai_default
    api_key: "{{ env.OPENAI_API_KEY | default('') }}"
    # Optional override: set OPENAI_BASE_URL to use an OpenAI-compatible endpoint/proxy.
    # When empty/unset, the OpenAI SDK default (https://api.openai.com/v1) is used.
    base_url: "{{ env.OPENAI_BASE_URL | default('') }}"

  # OMLX OpenAI-compatible gateway (embedding + lightweight chat)
  # Env: OMLX_OPENAI_API_BASE, OMLX_OPENAI_API_KEY
  omlx_openai: &omlx_openai
    api_key: "{{ env.OMLX_OPENAI_API_KEY | default('') }}"
    base_url: "{{ env.OMLX_OPENAI_API_BASE | default('') }}"

  # TUFA OpenAI-compatible gateway (primary chat)
  # Env: TUFA_OPENAI_API_HOST, TUFA_OPENAI_API_KEY
  tufa_openai: &tufa_openai
    api_key: "{{ env.TUFA_OPENAI_API_KEY | default('') }}"
    base_url: "{{ env.TUFA_OPENAI_API_HOST | default('') }}"

# ----------------------------------------------------------------------------
# Models (required)
# ----------------------------------------------------------------------------
models:
  defaults:
    # Default chat: TUFA gateway (override: CRYSTALITH_DEFAULT_CHAT_MODEL=omlx-chat)
    chat: "{{ env.CRYSTALITH_DEFAULT_CHAT_MODEL | default('tufa-chat') }}"
    # Default embedding: OMLX gateway (override: CRYSTALITH_DEFAULT_EMBEDDING_MODEL)
    embedding: "{{ env.CRYSTALITH_DEFAULT_EMBEDDING_MODEL | default('omlx-embedding') }}"

  available:
    # -------------------- OpenAI (chat) --------------------
    - id: "deepseek-chat"
      provider: "openai"
      model: "deepseek-chat"
      display_name: "DeepSeek Chat"
      description: "DeepSeek chat model"
      roles: [chat, edit]
      capabilities: [tool_use]
      provider_config:
        <<: *openai_default
      completion_options:
        temperature: 0.7
        max_tokens: 4096

    # -------------------- OpenAI (embedding) --------------------
    - id: "text-embedding-3-small"
      provider: "openai"
      model: "text-embedding-3-small"
      display_name: "text-embedding-3-small"
      description: "OpenAI embedding model"
      roles: [embed]
      provider_config:
        <<: *openai_default

    # -------------------- OpenAI-compatible gateway (embedding) --------------------
    # NOTE: These model ids are commonly provided by OpenAI-compatible gateways (not by api.openai.com).
    - id: "bge-m3-openai"
      provider: "openai"
      model: "BAAI/bge-m3"
      display_name: "BGE-M3 (gateway)"
      description: "Embedding model via OpenAI-compatible gateway"
      roles: [embed]
      provider_config:
        <<: *openai_default

    - id: "qwen3-embedding-openai"
      provider: "openai"
      model: "Qwen/Qwen3-Embedding-8B"
      display_name: "Qwen3 Embedding 8B (gateway)"
      description: "Embedding model via OpenAI-compatible gateway"
      roles: [embed]
      provider_config:
        <<: *openai_default

    # -------------------- OMLX gateway (OpenAI-compatible) --------------------
    # Model names controlled by OMLX_OPENAI_DEFAULT_* env vars.
    - id: "omlx-embedding"
      provider: "openai"
      model: "{{ env.OMLX_OPENAI_DEFAULT_EMBEDDING_MODEL | default('bge-m3-mlx-8bit') }}"
      display_name: "OMLX Embedding"
      description: "Embedding via OMLX OpenAI-compatible gateway"
      roles: [embed]
      provider_config:
        <<: *omlx_openai

    - id: "omlx-chat"
      provider: "openai"
      model: "{{ env.OMLX_OPENAI_DEFAULT_CHAT_MODEL | default('Qwen3.5-0.8B-MLX-bf16') }}"
      display_name: "OMLX Chat"
      description: "Lightweight chat via OMLX OpenAI-compatible gateway"
      roles: [chat, edit]
      capabilities: [tool_use]
      provider_config:
        <<: *omlx_openai
      completion_options:
        temperature: 0.7
        max_tokens: 4096

    # -------------------- TUFA gateway (OpenAI-compatible) --------------------
    # Model name controlled by TUFA_OPENAI_DEFAULT_CHATMODEL env var.
    - id: "tufa-chat"
      provider: "openai"
      model: "{{ env.TUFA_OPENAI_DEFAULT_CHATMODEL | default('Qwen3.6-35B-A3B/UD-Q5_K_XL-think-coding') }}"
      display_name: "TUFA Chat"
      description: "Primary chat via TUFA OpenAI-compatible gateway"
      roles: [chat, edit]
      capabilities: [tool_use]
      provider_config:
        <<: *tufa_openai
      completion_options:
        temperature: 0.7
        max_tokens: 8192

# ----------------------------------------------------------------------------
# Feature settings
# ----------------------------------------------------------------------------
embedding:
  chunk_size: 512
  batch_size: 32

# ----------------------------------------------------------------------------
# Concurrency guardrails (safe defaults)
# ----------------------------------------------------------------------------
# Applies to key I/O phases:
# - embedding: retrieval/qa/refine embedding calls
# - vector_search: vector DB search calls
# - llm_generate: chat/completions (including streaming) calls
#
# Set to 0 to disable a limiter.
concurrency:
  embedding: 8
  vector_search: 8
  llm_generate: 4

# ----------------------------------------------------------------------------
# Storage
# ----------------------------------------------------------------------------
vector_storage:
  provider: "chroma"
  chroma:
    path: "./data/chroma"
    telemetry: false
    # Empty host => embedded Chroma (no separate Chroma server required).
    host: ""
    port: 8000
    # Optional: auto-select a reachable remote Chroma endpoint (host dev port first, then compose service name).
    endpoint_candidates:
      - "http://127.0.0.1:8001"
      - "http://chromadb:8000"

database:
  url: "sqlite+aiosqlite:///./data/app.db"
  # Optional: auto-select a reachable external DB when available.
  url_candidates:
    - "postgresql+asyncpg://crystalith:{{ env.POSTGRES_PASSWORD | default('') }}@127.0.0.1:5434/crystalith"
    - "postgresql+asyncpg://crystalith:{{ env.POSTGRES_PASSWORD | default('') }}@postgres:5432/crystalith"

cache:
  # memory|redis|auto. auto selects a reachable redis if configured, else falls back to memory.
  provider: "auto"
  ttl: 60
  max_size: 2048
  redis_url_candidates:
    - "redis://127.0.0.1:6380/0"
    - "redis://redis:6379/0"

# ----------------------------------------------------------------------------
# Context window
# ----------------------------------------------------------------------------
context_window:
  max_tokens: 8000
  compression_strategy: "truncate"
  window_size: 10
  priority:
    - history
    - retrieval
    - recent
    - system

# ----------------------------------------------------------------------------
# Search engine (optional)
# ----------------------------------------------------------------------------
search:
  searxng:
    # Empty host disables web search by default.
    # Prefer enabling via YAML endpoint candidates (dev deps / compose overlay).
    host: ""
    endpoint_candidates:
      - "http://gateway.lan:50201"
      - "http://127.0.0.1:50201"
      - "http://searxng:8080"
    timeout: 10
    max_results: 10

# ----------------------------------------------------------------------------
# Optional service contracts (core remains available when these are unavailable)
# ----------------------------------------------------------------------------
optional_services:
  # frontend/backend core naming maps to compose services web/api.
  chroma:
    enabled: false
    endpoint: "http://localhost:8000"
    endpoint_candidates:
      - "http://127.0.0.1:8001"
      - "http://chromadb:8000"
    timeout_s: 3
    probe:
      enabled: true
      timeout_s: 3
      interval_s: 15
      path: "/api/v1/heartbeat"
    degrade_policy: "core_available"

  redis:
    enabled: false
    endpoint: "redis://localhost:6379/0"
    endpoint_candidates:
      - "redis://127.0.0.1:6380/0"
      - "redis://redis:6379/0"
    timeout_s: 3
    probe:
      enabled: true
      timeout_s: 3
      interval_s: 15
      path: null
    degrade_policy: "core_available"

  searxng:
    enabled: false
    endpoint: "http://gateway.lan:50201"
    endpoint_candidates:
      - "http://gateway.lan:50201"
      - "http://127.0.0.1:50201"
      - "http://searxng:8080"
    timeout_s: 10
    probe:
      enabled: true
      timeout_s: 10
      interval_s: 30
      path: "/search?q=&format=json"
    degrade_policy: "core_available"

# ----------------------------------------------------------------------------
# Proxy settings (YAML anchor for optional reuse)
# ----------------------------------------------------------------------------
proxy_settings: &default_proxy
  enabled: false
  http_url: null
  https_url: null
  socks5_url: null
  no_proxy:
    - localhost
    - "127.0.0.1"

# ----------------------------------------------------------------------------
# Source ingestion
# ----------------------------------------------------------------------------
source_ingestion:
  url_fetch:
    proxy:
      <<: *default_proxy
    timeout: 30
    retry_count: 2
    retry_delay: 1.0
    security:
      # SSRF protections for "source from URL" fetch mode.
      # Safe by default: blocks localhost/private networks/metadata IPs unless explicitly allowlisted.
      allowlist_hosts: []
      allowlist_domains: []
      allowlist_cidrs: []
      allowlist_only: false
      max_redirects: 5

  web_extraction:
    # NOTE: Extractor implementations are provided by plugins.
    # Install: `pip install 'crystalith[official-full]'` (recommended) or the individual `crystalith-extractor-*` packages.
    fallback_order:
      - trafilatura
      - jina
      - firecrawl
      - browserless
    enable_fallback: true

    trafilatura:
      enabled: true
      include_tables: true
      include_links: true
      output_format: "markdown"
      timeout: 30
      proxy:
        <<: *default_proxy

    jina:
      enabled: true
      api_key: "{{ env.JINA_API_KEY | default('') }}"
      timeout: 30
      proxy:
        <<: *default_proxy

    firecrawl:
      enabled: false
      api_key: "{{ env.FIRECRAWL_API_KEY | default('') }}"
      timeout: 60

    browserless:
      enabled: false
      endpoint: "ws://localhost:3000"
      token: "{{ env.BROWSERLESS_TOKEN | default('') }}"
