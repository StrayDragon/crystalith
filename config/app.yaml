# yaml-language-server: $schema=./app.schema.json
# ============================================================================
# Crystalith Configuration (safe defaults for public repo)
# ============================================================================
# Notes:
# - Do NOT commit secrets. Use `.env` (Docker Compose) or `CRYSTALITH_SECRETS_PATH`.
# - Supports YAML anchors, environment interpolation (${{ env.VAR }}),
#   and secrets interpolation (${{ secrets.VAR }}).
%YAML 1.1
---
# ----------------------------------------------------------------------------
# Metadata
# ----------------------------------------------------------------------------
name: "Crystalith"
version: "1.0.0"
schema: v1

# ----------------------------------------------------------------------------
# App / web server
# ----------------------------------------------------------------------------
app:
  auth:
    # Optional API key auth for self-host deployments.
    # When enabled, all /v1/** endpoints require `Authorization: Bearer <token>`.
    enabled: false
    # api_key: "${{ env.CRYSTALITH_API_KEY }}"

  cors:
    # Allowed origins for browser clients (CORS).
    # Keep this list tight in production.
    allow_origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"

  startup:
    # If true, deletes sources with status=failed on backend startup.
    # WARNING: This removes DB rows and may orphan related files/vectors.
    cleanup_failed_sources: false

# ----------------------------------------------------------------------------
# Providers (use YAML anchors for reuse)
# ----------------------------------------------------------------------------
providers:
  # OpenAI-compatible API
  openai_default: &openai_default
    api_key: "${{ env.OPENAI_API_KEY }}"
    base_url: "https://api.openai.com/v1"

  # Local Ollama
  ollama_local: &ollama_local
    host: "http://localhost:11434"

# ----------------------------------------------------------------------------
# Optional Ollama defaults (anchor)
# ----------------------------------------------------------------------------
ollama_defaults:
  embedding_options: &ollama_embedding_options
    num_ctx: 32768
    num_thread: "auto"
    temperature: 0.1
    num_batch: 256
    mlock: true
    numa: true
    low_vram: false

# ----------------------------------------------------------------------------
# Models (required)
# ----------------------------------------------------------------------------
models:
  defaults:
    # One-click default path: OpenAI
    chat: "gpt-5.2"
    embedding: "text-embedding-3-small"

  available:
    # -------------------- OpenAI (chat) --------------------
    - id: "gpt-5.2"
      provider: "openai"
      model: "gpt-5.2"
      display_name: "GPT-5.2"
      description: "OpenAI chat model"
      roles: [chat, edit]
      capabilities: [tool_use, image_input]
      provider_config:
        <<: *openai_default
      completion_options:
        temperature: 0.7
        max_tokens: 4096

    - id: "gpt-5.2-codex"
      provider: "openai"
      model: "gpt-5.2-codex"
      display_name: "GPT-5.2 Codex"
      description: "Code-focused model"
      roles: [chat, edit, autocomplete]
      capabilities: [tool_use]
      provider_config:
        <<: *openai_default
      completion_options:
        temperature: 0.3

    # -------------------- OpenAI (embedding) --------------------
    - id: "text-embedding-3-small"
      provider: "openai"
      model: "text-embedding-3-small"
      display_name: "text-embedding-3-small"
      description: "OpenAI embedding model"
      roles: [embed]
      provider_config:
        <<: *openai_default

    # -------------------- Ollama (offline optional) --------------------
    - id: "qwen-local"
      provider: "ollama"
      model: "qwen2.5-coder:1.5b"
      display_name: "Qwen 2.5 (local)"
      description: "Local chat model via Ollama"
      roles: [chat]
      provider_config:
        <<: *ollama_local

    - id: "bge-m3-local"
      provider: "ollama"
      model: "bge-m3:567m"
      display_name: "BGE-M3 (local)"
      description: "Local embedding model via Ollama"
      roles: [embed]
      provider_config:
        <<: *ollama_local
      ollama_options:
        <<: *ollama_embedding_options

# ----------------------------------------------------------------------------
# Feature settings
# ----------------------------------------------------------------------------
embedding:
  chunk_size: 512
  batch_size: 32

# ----------------------------------------------------------------------------
# Concurrency guardrails (safe defaults)
# ----------------------------------------------------------------------------
# Applies to key I/O phases:
# - embedding: retrieval/qa/refine embedding calls
# - vector_search: vector DB search calls
# - llm_generate: chat/completions (including streaming) calls
#
# Set to 0 to disable a limiter. Env overrides:
# - CRYSTALITH_CONCURRENCY__EMBEDDING
# - CRYSTALITH_CONCURRENCY__VECTOR_SEARCH
# - CRYSTALITH_CONCURRENCY__LLM_GENERATE
concurrency:
  embedding: 8
  vector_search: 8
  llm_generate: 4

# ----------------------------------------------------------------------------
# Storage
# ----------------------------------------------------------------------------
vector_storage:
  provider: "chroma"
  chroma:
    path: "./data/chroma"
    telemetry: false
    # Empty host => embedded Chroma (no separate Chroma server required).
    host: ""
    port: 8000
  sqlite:
    path: "./data/vectors.db"

database:
  url: "sqlite+aiosqlite:///./data/app.db"

# ----------------------------------------------------------------------------
# Context window
# ----------------------------------------------------------------------------
context_window:
  max_tokens: 8000
  compression_strategy: "truncate"
  window_size: 10
  priority:
    - history
    - retrieval
    - recent
    - system

# ----------------------------------------------------------------------------
# Search engine (optional)
# ----------------------------------------------------------------------------
search:
  searxng:
    # host: "http://host.docker.internal:50201"
    host: "http://gateway.lan:50201"
    timeout: 10
    max_results: 10

# ----------------------------------------------------------------------------
# Optional service contracts (core remains available when these are unavailable)
# ----------------------------------------------------------------------------
optional_services:
  # frontend/backend core naming maps to compose services web/api.
  ollama:
    enabled: false
    endpoint: "http://localhost:11434"
    timeout_s: 3
    probe:
      enabled: true
      timeout_s: 3
      interval_s: 15
      path: "/api/tags"
    degrade_policy: "core_available"

  chroma:
    enabled: false
    endpoint: "http://localhost:8000"
    timeout_s: 3
    probe:
      enabled: true
      timeout_s: 3
      interval_s: 15
      path: "/api/v1/heartbeat"
    degrade_policy: "core_available"

  redis:
    enabled: false
    endpoint: "redis://localhost:6379/0"
    timeout_s: 3
    probe:
      enabled: true
      timeout_s: 3
      interval_s: 15
      path: null
    degrade_policy: "core_available"

  searxng:
    enabled: false
    # endpoint: "http://host.docker.internal:50201"
    endpoint: "http://gateway.lan:50201"
    timeout_s: 10
    probe:
      enabled: true
      timeout_s: 10
      interval_s: 30
      path: "/search?q=ping&format=json"
    degrade_policy: "core_available"

# ----------------------------------------------------------------------------
# Proxy settings (YAML anchor for optional reuse)
# ----------------------------------------------------------------------------
proxy_settings: &default_proxy
  enabled: false
  http_url: null
  https_url: null
  socks5_url: null
  no_proxy:
    - localhost
    - "127.0.0.1"

# ----------------------------------------------------------------------------
# Source ingestion
# ----------------------------------------------------------------------------
source_ingestion:
  url_fetch:
    proxy:
      <<: *default_proxy
    timeout: 30
    retry_count: 2
    retry_delay: 1.0
    security:
      # SSRF protections for "source from URL" fetch mode.
      # Safe by default: blocks localhost/private networks/metadata IPs unless explicitly allowlisted.
      allowlist_hosts: []
      allowlist_domains: []
      allowlist_cidrs: []
      allowlist_only: false
      max_redirects: 5

  web_extraction:
    fallback_order:
      - trafilatura
      - jina
      - firecrawl
      - browserless
    enable_fallback: true

    trafilatura:
      enabled: true
      include_tables: true
      include_links: true
      output_format: "markdown"
      timeout: 30
      proxy:
        <<: *default_proxy

    jina:
      enabled: true
      api_key: ""
      timeout: 30
      proxy:
        <<: *default_proxy

    firecrawl:
      enabled: false
      api_key: "${{ env.FIRECRAWL_API_KEY }}"
      timeout: 60

    browserless:
      enabled: false
      endpoint: "ws://localhost:3000"
