# yaml-language-server: $schema=./schema.json
# ============================================================================
# Crystalith Configuration
# ============================================================================
# 支持的特性:
# - YAML anchors 用于复用配置 (推荐!)
# - 环境变量: ${{ env.VAR_NAME }}
# - Secrets: ${{ secrets.SECRET_NAME }} (需要 secrets.yaml)
#
# YAML 版本头启用高级特性如 anchors:
%YAML 1.1
---
# 配置元数据
name: "Crystalith"
version: "1.0.0"
schema: v1

# ============================================================================
# Providers (使用 YAML anchors 定义可复用的提供商配置)
# ============================================================================
providers:
  # OpenAI 兼容 API (可用于 OpenRouter, Azure 等)
  openai_proxy: &openai_proxy
    api_key: "sk-WeJOLbzllGll3qGUybVBimMlU6GJZcCrw13hEtMt4bQ7wxxB"
    base_url: "http://urchinet.lan:50256/v1"

  # 本地 Ollama
  ollama_local: &ollama_local
    host: "http://localhost:11434"

# ============================================================================
# 默认 Ollama 运行时选项 (可复用)
# ============================================================================
ollama_defaults:
  embedding_options: &ollama_embedding_options
    num_ctx: 32768
    num_thread: "auto"
    temperature: 0.1
    num_batch: 256
    mlock: true
    numa: true
    low_vram: false

# ============================================================================
# Models - 多模型配置 (必需)
# ============================================================================
models:
  # 默认模型选择
  defaults:
    chat: "gpt-5.2"
    embedding: "bge-m3-local"

  # 可用模型列表
  available:
    # ==================== OpenAI GPT 系列 ====================
    - id: "gpt-5.2"
      provider: "openai"
      model: "gpt-5.2"
      display_name: "GPT-5.2"
      description: "最新 OpenAI 模型，综合能力强"
      roles: [chat, edit]
      capabilities: [tool_use, image_input]
      provider_config:
        <<: *openai_proxy
      completion_options:
        temperature: 0.7
        max_tokens: 4096

    - id: "gpt-5.2-codex"
      provider: "openai"
      model: "gpt-5.2-codex"
      display_name: "GPT-5.2 Codex"
      description: "代码专用模型"
      roles: [chat, edit, autocomplete]
      capabilities: [tool_use]
      provider_config:
        <<: *openai_proxy
      completion_options:
        temperature: 0.3

    # ==================== DeepSeek 系列 ====================
    - id: "deepseek-chat"
      provider: "openai"
      model: "deepseek-chat"
      display_name: "DeepSeek Chat"
      description: "DeepSeek 对话模型，性价比高"
      roles: [chat]
      provider_config:
        <<: *openai_proxy

    - id: "deepseek-r1"
      provider: "openai"
      model: "deepseek-ai/DeepSeek-R1"
      display_name: "DeepSeek R1"
      description: "DeepSeek 推理模型，适合复杂任务"
      roles: [chat]
      capabilities: [tool_use]
      provider_config:
        <<: *openai_proxy
      completion_options:
        reasoning: true

    # ==================== Claude ====================
    - id: "claude-4-sonnet"
      provider: "openai"
      model: "anthropic/claude-4-sonnet"
      display_name: "Claude 4 Sonnet"
      description: "Anthropic Claude 4 模型"
      roles: [chat, edit]
      capabilities: [tool_use, image_input]
      provider_config:
        <<: *openai_proxy

    # ==================== Gemini ====================
    - id: "gemini-2.5-pro"
      provider: "openai"
      model: "google/gemini-2.5-pro"
      display_name: "Gemini 2.5 Pro"
      description: "Google Gemini Pro 模型"
      roles: [chat]
      capabilities: [tool_use, image_input]
      provider_config:
        <<: *openai_proxy

    # ==================== 本地模型 ====================
    - id: "qwen-local"
      provider: "ollama"
      model: "qwen2.5-coder:1.5b"
      display_name: "Qwen 2.5 (本地)"
      description: "本地运行的轻量模型，无需网络"
      roles: [chat]
      provider_config:
        <<: *ollama_local

    - id: "bge-m3-local"
      provider: "ollama"
      model: "bge-m3:567m"
      display_name: "BGE-M3 (本地)"
      description: "本地运行的嵌入模型"
      roles: [embed]
      provider_config:
        <<: *ollama_local
      ollama_options:
        <<: *ollama_embedding_options

# ============================================================================
# 功能设置
# ============================================================================
embedding:
  chunk_size: 512
  batch_size: 32

# ============================================================================
# 存储
# ============================================================================
vector_storage:
  provider: "sqlite"
  sqlite:
    path: "./data/vectors.db"

database:
  url: "sqlite+aiosqlite:///./data/app.db"

# ============================================================================
# 上下文窗口
# ============================================================================
context_window:
  max_tokens: 8000
  compression_strategy: "truncate"
  window_size: 10
  priority:
    - history
    - retrieval
    - recent
    - system

# ============================================================================
# 搜索引擎
# ============================================================================
search:
  searxng:
    host: "http://urchinet.lan:50201"
    # api_key: ""  # 可选，仅当 SearXNG 实例需要认证时配置
    timeout: 10
    max_results: 10

# ============================================================================
# 代理设置 (YAML anchor，可被其他功能引用)
# ============================================================================
# 定义全局代理配置作为 anchor，其他功能可按需引用或覆盖
proxy_settings: &default_proxy
  enabled: true  # 启用代理
  http_url: "http://127.0.0.1:20171"   # HTTP 代理 URL
  https_url: "http://127.0.0.1:20171"  # HTTPS 代理 URL（可选，默认使用 http_url）
  socks5_url: null  # SOCKS5 代理 URL（例如 socks5://127.0.0.1:1080），设置后优先使用
  no_proxy:  # 不走代理的域名/IP列表
    - localhost
    - "127.0.0.1"

# ============================================================================
# 来源导入设置
# ============================================================================
source_ingestion:
  url_fetch:
    proxy:
      <<: *default_proxy
      # 可在此处覆盖全局代理设置
    timeout: 30       # 请求超时时间（秒）
    retry_count: 2    # 重试次数
    retry_delay: 1.0  # 重试间隔（秒）
