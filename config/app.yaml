# yaml-language-server: $schema=./schema.json
openai: &openai_default
  api_key: "***REMOVED***"
  base_url: "http://gateway.lan:50256/v1"
ollama:
  host: "http://localhost:11434"
embedding:
  provider: "ollama"
  model: "bge-m3:567m"
  ollama_options:
    num_ctx: 32768
    num_thread: "auto"
    temperature: 0.1
    num_batch: 256
    mlock: true
    numa: true
    low_vram: false
chat:
  provider: "openai"
  model: "gpt-5.2"
vector_storage:
  provider: "sqlite"
  sqlite:
    path: "./data/vectors.db"
context_window:
  max_tokens: 8000
  compression_strategy: "truncate"
  window_size: 10
  priority:
    - "history"
    - "retrieval"
    - "recent"
    - "system"

# Multi-model configuration
models:
  default_chat: "gpt-5.2"
  default_embedding: "bge-m3-local"
  available:
    # OpenAI GPT 系列
    - id: "gpt-5.2"
      provider: "openai"
      model: "gpt-5.2"
      display_name: "GPT-5.2"
      description: "最新 OpenAI 模型，综合能力强"
      capabilities: ["chat"]

    - id: "gpt-5.2-codex"
      provider: "openai"
      model: "gpt-5.2-codex"
      display_name: "GPT-5.2 Codex"
      description: "代码专用模型"
      capabilities: ["chat"]

    # DeepSeek 系列
    - id: "deepseek-chat"
      provider: "openai"
      model: "deepseek-chat"
      display_name: "DeepSeek Chat"
      description: "DeepSeek 对话模型，性价比高"
      capabilities: ["chat"]

    - id: "deepseek-r1"
      provider: "openai"
      model: "deepseek-ai/DeepSeek-R1"
      display_name: "DeepSeek R1"
      description: "DeepSeek 推理模型，适合复杂任务"
      capabilities: ["chat"]

    # Claude
    - id: "claude-4-sonnet"
      provider: "openai"
      model: "anthropic/claude-4-sonnet"
      display_name: "Claude 4 Sonnet"
      description: "Anthropic Claude 4 模型"
      capabilities: ["chat"]

    # Gemini
    - id: "gemini-2.5-pro"
      provider: "openai"
      model: "google/gemini-2.5-pro"
      display_name: "Gemini 2.5 Pro"
      description: "Google Gemini Pro 模型"
      capabilities: ["chat"]

    # 本地模型
    - id: "qwen-local"
      provider: "ollama"
      model: "qwen2.5-coder:1.5b"
      display_name: "Qwen 2.5 (本地)"
      description: "本地运行的轻量模型，无需网络"
      capabilities: ["chat"]

    - id: "bge-m3-local"
      provider: "ollama"
      model: "bge-m3:567m"
      display_name: "BGE-M3 (本地)"
      description: "本地运行的嵌入模型"
      capabilities: ["embedding"]
