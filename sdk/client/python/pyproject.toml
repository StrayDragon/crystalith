[project]
name = "crystalith-sdk"
version = "0.1.0"
description = "Crystalith API Python SDK (generated from OpenAPI)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "straydragon", email = "straydragonl@foxmail.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=1.10.0",
    "typing-extensions>=4.7.0",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"
