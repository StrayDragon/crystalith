services:
  web:
    build:
      context: .
      dockerfile: dockers/frontend/Dockerfile
    container_name: crystalith-web
    ports:
      - "${CL_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - frontend-net

  api:
    build:
      context: .
      dockerfile: dockers/backend/Dockerfile
    container_name: crystalith-api
    environment:
      HOST: 0.0.0.0
      PORT: 8032
      RELOAD: "0"

      # Auto-run Alembic migrations on startup
      AUTO_DB_INIT: "1"

      # Core env overrides (preferred in docker)
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://crystalith:crystalith@postgres:5432/crystalith}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"

      # Optional redis cache
      CACHE_PROVIDER: ${CACHE_PROVIDER:-memory}
      REDIS_URL: ${REDIS_URL:-}

      # Optional AI provider overrides
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      CRYSTALITH_DEFAULT_CHAT_MODEL: ${CRYSTALITH_DEFAULT_CHAT_MODEL:-}
      CRYSTALITH_DEFAULT_EMBEDDING_MODEL: ${CRYSTALITH_DEFAULT_EMBEDDING_MODEL:-}

      # Config discovery in container
      CRYSTALITH_CONFIG_PATH: /app/config/app.yaml
      CRYSTALITH_SECRETS_PATH: ${CRYSTALITH_SECRETS_PATH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api_data:/app/backend/py/data
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    networks:
      - frontend-net
      - backend-net

  postgres:
    image: postgres:18.1-trixie
    container_name: crystalith-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crystalith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crystalith}
      POSTGRES_DB: ${POSTGRES_DB:-crystalith}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M
    networks:
      - backend-net

  chromadb:
    image: ghcr.io/chroma-core/chroma:0.5.15
    container_name: crystalith-chromadb
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    networks:
      - backend-net

  redis:
    image: redis:7.4-alpine
    container_name: crystalith-redis
    profiles: ["redis"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - backend-net

volumes:
  pgdata: {}
  chromadata: {}
  api_data: {}
  redisdata: {}

networks:
  frontend-net: {}
  backend-net:
    internal: true
