# yaml-language-server: $schema=https://raw.githubusercontent.com/StrayDragon/llman/main/artifacts/schema/configs/en/llmanspec-config.schema.json
schema: spec-driven
locale: en
context: |-
  Project-wide tech stack, commands, conventions, testing, git rules, and doc governance: see ../AGENTS.md.

  Spec workflow paths:
  - Canonical specs: llmanspec/specs
  - Active change workspaces: llmanspec/changes (archive: llmanspec/changes/archive)
  - Deferred proposals / parked changes: llmanspec/notplan-changes

  Spec-workflow-specific notes:
  - If backend OpenAPI changes, run frontend `pnpm run api:sync` and verify.
  - Stable entrypoints: `just gen-docs`, `just docs-drift-check`, `just doc-governance-check` (expected to be part of `just check`).
rules:
  design:
  - For generated artifacts or injected blocks, include naming/marker rules and deterministic output expectations.
  - For repo-wide refactors, include an explicit migration + rollback boundary.
  proposal:
  - If the change renames paths/contracts, mark them as **BREAKING** and list old -> new explicitly.
  - If the change introduces/updates generated artifacts, specify the SSOT, generator entrypoint, and drift gate command.
  specs:
  - Use ADDED/MODIFIED/REMOVED/RENAMED sections as appropriate.
  - For MODIFIED requirements, copy the full updated requirement block (do not do partial diffs).
  tasks:
  - Group tasks by dependency order and include explicit verification commands.
  - Include drift-check commands whenever generated artifacts are involved.
