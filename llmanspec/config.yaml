# yaml-language-server: $schema=https://raw.githubusercontent.com/StrayDragon/llman-sdd/main/artifacts/schema/configs/en/llmanspec-config.schema.json
schema: spec-driven
locale: zh-CN

# v2 change id 规约：c{num}-{verb}-{subject}（active 校验；archive/ 与 frozen 包免检）
change_id:
  pattern: '^c(?<unique>[0-9]+)-[a-z0-9-]+$'
  template: 'c{{ llman_sdd_unique_id }}-{{ verb }}-{{ subject }}'

# BDD 执行入口已随测试精简裁撤（中文 BDD 套件整体移除，CRUD 合约由
# integration 深测 + e2e 接线覆盖）；specs 场景保持结构校验，不再挂 runner。
