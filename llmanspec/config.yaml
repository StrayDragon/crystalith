# yaml-language-server: $schema=https://raw.githubusercontent.com/StrayDragon/llman/main/artifacts/schema/configs/en/llmanspec-config.schema.json
schema: spec-driven
locale: zh-CN

# v2 change id 规约：c{num}-{verb}-{subject}（active 校验；archive/ 与 frozen 包免检）
change_id:
  pattern: '^c(?<unique>[0-9]+)-[a-z0-9-]+$'
  template: 'c{{ llman_sdd_unique_id }}-{{ verb }}-{{ subject }}'

# BDD-on（feature-as-spec 前置）：specs 含可执行场景时 validate/finalize 门要求声明
# 项目 BDD 执行入口；runner（apps/server/tests/bdd/）自 c111 起支持 规则: 块嵌套场景。
bdd:
  run_command: "bun test apps/server/tests/bdd/run.test.ts"
