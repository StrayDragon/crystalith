# yaml-language-server: $schema=https://raw.githubusercontent.com/StrayDragon/llman/main/artifacts/schema/configs/en/llmanspec-config.schema.json
schema: spec-driven
locale: en
context: |-
  Tech stack:
  - Backend: FastAPI (Python) in backend/py/src/crystalith; tests in backend/py/tests; workspace libs in backend/py/packages.
  - Frontend: Vite + React + TypeScript in frontend/web/src.
  - Specs: canonical specs in llmanspec/specs; active change workspaces in llmanspec/changes (archive in llmanspec/changes/archive); deferred proposals or parked changes in llmanspec/notplan-changes.

  Commands (from repo root):
  - Backend: cd backend/py && uv sync; just dev; just test; just db-init; just config-schema; just packages-test; just llm-eval; just embedding-cache-bench.
  - Frontend: cd frontend/web && pnpm install; pnpm dev; pnpm test; pnpm run lint; pnpm run lint:all; pnpm run format; pnpm run format:check; pnpm typecheck; pnpm run build; pnpm run api:sync.

  Conventions:
  - Python: 4-space indentation; prefer high-coverage type hints; minimize Any; avoid dynamic attribute access (getattr/hasattr/__getattr__); snake_case functions/vars; PascalCase classes.
  - TypeScript/React: 2-space indentation; PascalCase components; hooks named useX.
  - CSS/Tailwind: global styles in frontend/web/src/app/index.css; feature styles alongside components.
  - No repo-wide formatter configured outside frontend/web; frontend uses oxlint + oxfmt. Match existing style elsewhere and avoid unrelated reformatting.

  Testing:
  - Backend: pytest + pytest-asyncio.
  - Frontend: Vitest + React Testing Library.

  Git:
  - Commit prefixes: feat:, fix:, refactor:, doc:, dev:, misc: (optional scope like feat(backend):).

  Notes:
  - If backend OpenAPI changes, run frontend `pnpm run api:sync` and verify.
  - See llmanspec/config.yaml for spec/change workflow conventions.
  - Doc governance:
    - Files named `*.gen.*` are generated; do not edit by hand.
    - `<!-- BEGIN AUTOGEN:<id> -->...<!-- END AUTOGEN:<id> -->` blocks are injected; do not edit block contents by hand.
    - Stable entrypoints: `just gen-docs`, `just docs-drift-check`, `just doc-governance-check` (expected to be part of `just check`).
rules:
  design:
  - For generated artifacts or injected blocks, include naming/marker rules and deterministic output expectations.
  - For repo-wide refactors, include an explicit migration + rollback boundary.
  proposal:
  - If the change renames paths/contracts, mark them as **BREAKING** and list old -> new explicitly.
  - If the change introduces/updates generated artifacts, specify the SSOT, generator entrypoint, and drift gate command.
  specs:
  - Use ADDED/MODIFIED/REMOVED/RENAMED sections as appropriate.
  - For MODIFIED requirements, copy the full updated requirement block (do not do partial diffs).
  tasks:
  - Group tasks by dependency order and include explicit verification commands.
  - Include drift-check commands whenever generated artifacts are involved.
