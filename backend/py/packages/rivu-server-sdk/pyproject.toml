[project]
name = "rivu-server-sdk"
version = "0.1.0"
description = "Rivu server-side SDK (Python) for AG-UI compatible UI runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rivu_server_sdk"]
