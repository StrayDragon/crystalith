[project]
name = "cl-logs"
version = "0.1.0"
description = "see README.md"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "straydragon", email = "straydragonl@foxmail.com" }]
dependencies = [
    "structlog>=25.5.0",
    "rich>=14.1.0",
    "cl-stdx",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
cl-stdx = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=cl_logs --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true


[tool.ruff]
line-length = 140
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
fixable = ["F401", "ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

select = ["ALL"]
ignore = [
    # === 代码质量与复杂性 ===
    "C901",    # 函数复杂度过高,影响可读性
    "PLR0912", # 函数分支过多,建议重构
    "PLR0913", # 函数参数过多,难以维护
    "PLR0915", # 函数语句过多,建议拆分
    "PLR0911", # 函数返回语句过多,逻辑复杂
    "PLR2004", # 使用魔术数值,建议使用常量
    "SIM108",  # 更倾向于使用ifelse表达式,而不是if/else语句

    # === 类型注解 ===
    "ANN002", # 函数*args参数缺少类型注解
    "ANN003", # 函数**kwargs参数缺少类型注解
    "ANN401", # 使用Any类型,建议使用具体类型

    # === 函数参数设计 ===
    "FBT001", # 布尔类型位置参数,易混淆
    "FBT002", # 布尔默认值位置参数,易误用
    "N805",   # 与pydantic field_validator冲突(cls->self X), 先忽略, 后面再处理

    # === 异常处理 ===
    "BLE001", # 捕获所有异常,隐藏问题
    "TRY003", # 异常消息应在类中定义
    "TRY004", # 类型检查应抛出TypeError

    # === 代码简化 ===
    "SIM102", # 可折叠的if语句,简化代码

    # === 格式规范 ===
    "COM812", # 缺少尾随逗号,影响diff
    "E501",   # 行长度过长,影响可读性

    # === 日志记录 ===
    "G004", # 日志使用f-string,影响性能

    # === 类型检查优化 ===
    "TC001", # 仅用于类型检查的导入,优化性能
    "TC002", # 仅用于类型检查的导入,优化性能
    "TC003", # 仅用于类型检查的导入,优化性能

    # === 代码清理 ===
    "ERA001", # 注释掉的代码,应删除

    # === 私有成员访问 ===
    "SLF001", # 访问私有成员,破坏封装

    # === 日期时间处理 ===
    "DTZ001", # datetime缺少时区信息
    "DTZ005", # datetime.now()缺少时区

    # === 调试代码 ===
    "T201", # print语句调试代码,生产环境禁用

    # === T O D O管理 ===
    "TD002", # 缺少作者信息
    "TD003", # 缺少问题链接

    # === 其他 ===
    "D",  # 文档字符串相关规则
    "EM", # 错误消息相关规则
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    # === 测试代码质量 ===
    "B011",    # assert False应改为raise AssertionError
    "B008",    # 函数调用作为默认参数
    "ARG001",  # 未使用的函数参数
    "ARG002",  # 未使用的方法参数
    "ARG005",  # lambda中未使用的参数
    "F841",    # 未使用的变量
    "B018",    # 无用的表达式
    "N806",    # 函数中非小写变量名
    "W293",    # 空行包含空格
    "N802",    # 函数名不规范
    "PERF401", # 性能相关
    "PT",      # assert 相关

    # === 测试安全相关 ===
    "S101", # assert语句(测试中使用)
    "S105", # 硬编码密码字符串
    "S201", # Flask debug=True
    "S301", # 可疑的pickle使用
    "S311", # 非加密安全的随机数

    # === 测试异常处理 ===
    "BLE001", # 捕获所有异常
    "B017",   # assertRaises捕获Exception
    "PT011",  # pytest.raises缺少match参数
    "PT017",  # except中的assert语句
    "EM101",  # 异常中的原始字符串

    # === 测试代码复杂度 ===
    "C901",    # 函数复杂度过高
    "PLR2004", # 魔术数值

    # === 测试导入相关 ===
    "PLC0415", # 函数内import语句
    "ANN",     # 类型注解(测试中宽松)
    "TC",      # 类型检查的导入

    # === 测试参数设计 ===
    "FBT001", # 布尔类型位置参数
    "FBT002", # 布尔默认值位置参数
    "FBT003", # 布尔位置参数调用

    # === 测试异常处理 ===
    "TRY003", # 异常消息定义

    # === 测试代码简化 ===
    "SIM117", # 多个连续的with语句

    # === 测试格式规范 ===
    "E501", # 行长度过长

    # === 测试日志处理 ===
    "G004", # 日志使用f-string

    # === 测试调试代码 ===
    "T201", # print语句

    # === 测试文档相关 ===
    "D", # 文档字符串

    # === 测试私有访问 ===
    "SLF001", # 私有成员访问

    # === 测试Unicode ===
    "RUF001", # 模糊的Unicode字符

    # === 测试路径处理 ===
    "PTH", # pathlib相关规则

    # === 测试日期时间 ===
    "DTZ001", # datetime缺少时区
    "DTZ005", # datetime.now()缺少时区

    # === 测试代码清理 ===
    "ERA001", # 注释掉的代码

    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ============================================================================
# basedpyright 配置 - 独立包配置
# ============================================================================
[tool.basedpyright]
pythonVersion = "3.12"

reportUnannotatedClassAttribute = "none"
reportUnreachable = "none"
reportUnnecessaryIsInstance = "none"
reportAny = "none"
reportExplicitAny = "none"
reportConstantRedefinition = "none"
reportUnnecessaryComparison = "none"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnusedCallResult = false
reportUnusedFunction = false
reportUnusedParameter = false
reportExplicitAny = "none"
reportAny = "none"
reportArgumentType = "none"

[[tool.basedpyright.executionEnvironments]]
root = "src"
