[project]
name = "cl-stdx"
version = "0.1.0"
description = "Crystalith std extensions"
requires-python = ">=3.12"
authors = [
    { name = "Crystalith" }
]
dependencies = [
    "pydantic>=2.11.0,<3.0.0",
    "typing-extensions>=4.12.2",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
