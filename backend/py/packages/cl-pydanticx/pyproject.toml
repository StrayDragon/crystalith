[project]
name = "cl-pydanticx"
version = "0.1.0"
description = "Crystalith internal pydantic helpers"
requires-python = ">=3.12"
authors = [
    { name = "straydragon", email = "straydragonl@foxmail.com" }
]
dependencies = [
    "pydantic>=2.11.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
