[project]
name = "cl-fastapix"
version = "0.1.0"
description = "Crystalith internal FastAPI helpers"
requires-python = ">=3.12"
authors = [
    { name = "straydragon", email = "straydragonl@foxmail.com" }
]
dependencies = [
    "fastapi>=0.117.1",
    "typing-extensions>=4.12.2",
    "cl-stdx",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
cl-stdx = { workspace = true }
