[project]
name = "cl-sqlalchemyx"
version = "0.1.0"
description = "Crystalith internal SQLAlchemy helpers"
requires-python = ">=3.12"
authors = [
    { name = "straydragon", email = "straydragonl@foxmail.com" }
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.43",
    "pydantic>=2.11.0,<3.0.0",
    "typing-extensions>=4.12.2",
    "cl-pydanticx",
    "cl-stdx",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
cl-pydanticx = { workspace = true }
cl-stdx = { workspace = true }
