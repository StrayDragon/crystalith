[project]
name = "crystalith-parser-media"
version = "0.1.0"
description = "Official Crystalith ParserPlugin (audio/video)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "crystalith", email = "devnull@example.com" }]
dependencies = [
  "crystalith",
]

[project.entry-points."crystalith.plugins"]
parser-media = "crystalith_parser_media.plugin:plugin"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
