[project]
name = "crystalith-extractor-browserless"
version = "0.1.0"
description = "Official Crystalith WebExtractorPlugin (browserless)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "crystalith", email = "devnull@example.com" }]
dependencies = [
  "crystalith",
  "trafilatura>=2.0.0",
  "playwright>=1.40.0",
]

[project.entry-points."crystalith.plugins"]
extractor-browserless = "crystalith_extractor_browserless.plugin:plugin"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
