[project]
name = "crystalith-extractor-firecrawl"
version = "0.1.0"
description = "Official Crystalith WebExtractorPlugin (firecrawl)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "crystalith", email = "devnull@example.com" }]
dependencies = [
  "crystalith",
  "firecrawl-py>=4.0.0",
]

[project.entry-points."crystalith.plugins"]
extractor-firecrawl = "crystalith_extractor_firecrawl.plugin:plugin"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
