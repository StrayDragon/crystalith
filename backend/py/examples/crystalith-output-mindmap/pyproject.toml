[project]
name = "crystalith-output-mindmap"
version = "0.1.0"
description = "Example Crystalith OutputTypePlugin (MINDMAP)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "crystalith", email = "devnull@example.com" }]
dependencies = [
  "crystalith",
  "pydantic>=2.0.0",
]

[project.entry-points."crystalith.plugins"]
output-mindmap = "crystalith_output_mindmap.plugin:plugin"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
