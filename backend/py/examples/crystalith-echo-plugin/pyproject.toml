[project]
name = "crystalith-echo-plugin"
version = "0.1.0"
description = "Example Crystalith backend plugin (echo provider)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "crystalith", email = "devnull@example.com" }]
dependencies = []

[project.entry-points."crystalith.plugins"]
echo = "crystalith_echo_plugin.plugin:plugin"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
