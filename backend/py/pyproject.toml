[project]
name = "crystalith"
version = "0.1.0"
description = "Notebook-centric AI workspace with RAG over your sources."
readme = "README.md"
authors = [
    { name = "straydragon", email = "straydragonl@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "beautifulsoup4>=4.12.3",
    "cl-fastapix",
    "cl-logs",
    "cl-pydanticx",
    "cl-sqlalchemyx",
    "cl-stdx",
    "fastapi>=0.117.1",
    "httpx>=0.27.0",
    "langchain-community>=0.3.0",
    "lxml>=5.2.2",
    "pydantic-graph>=0.1.0",
    "ollama>=0.3.3",
    "openai>=1.40.0",
    "pydantic-ai>=0.0.49",
    "pypdf>=4.3.1",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.9",
    "scalar-fastapi>=1.6.0",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.30.0",
    "tiktoken>=0.12.0",
    "jsonschema>=4.26.0",
    "chromadb>=0.5.15",
    # Web content extraction
    "trafilatura>=2.0.0",
    "firecrawl-py>=4.0.0",
]

[project.optional-dependencies]
official-outputs = [
    "crystalith-output-faq",
    "crystalith-output-guide",
    "crystalith-output-timeline",
    "crystalith-output-mindmap",
    "crystalith-output-quiz",
    "crystalith-output-briefing",
]
official-parsers = [
    "crystalith-parser-pdf",
    "crystalith-parser-html",
    "crystalith-parser-media",
]
official-extractors = [
    "crystalith-extractor-trafilatura",
    "crystalith-extractor-jina",
    "crystalith-extractor-firecrawl",
    "crystalith-extractor-browserless",
]
official-full = [
    "crystalith-output-faq",
    "crystalith-output-guide",
    "crystalith-output-timeline",
    "crystalith-output-mindmap",
    "crystalith-output-quiz",
    "crystalith-output-briefing",
    "crystalith-parser-pdf",
    "crystalith-parser-html",
    "crystalith-parser-media",
    "crystalith-extractor-trafilatura",
    "crystalith-extractor-jina",
    "crystalith-extractor-firecrawl",
    "crystalith-extractor-browserless",
]
browserless = [
    "playwright>=1.40.0",
]
redis = [
    "redis>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]

[tool.uv.sources]
crystalith = { workspace = true }
cl-fastapix = { workspace = true }
cl-logs = { workspace = true }
cl-pydanticx = { workspace = true }
cl-sqlalchemyx = { workspace = true }
cl-stdx = { workspace = true }
crystalith-output-faq = { workspace = true }
crystalith-output-guide = { workspace = true }
crystalith-output-briefing = { workspace = true }
crystalith-output-quiz = { workspace = true }
crystalith-output-timeline = { workspace = true }
crystalith-output-mindmap = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "freezegun>=1.5.1",
    "jinja2sql>=0.3.4",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.13.1",
    "crystalith-output-faq",
    "crystalith-output-guide",
    "crystalith-output-briefing",
    "crystalith-output-quiz",
    "crystalith-output-timeline",
    "crystalith-output-mindmap",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Use -n auto to run tests in parallel with pytest-xdist
# Example: uv run pytest -n auto
addopts = "--cov=crystalith --cov-report=term --cov-fail-under=85"

[tool.coverage.report]
fail_under = 85

[tool.coverage.run]
concurrency = ["greenlet"]

[tool.basedpyright]
pythonVersion = "3.12"

# Keep the baseline actionable: forbid explicit Any in app code, but avoid
# turning every third-party stub gap into a hard failure.
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[[tool.basedpyright.executionEnvironments]]
root = "src"
reportExplicitAny = "error"
reportAny = "warning"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["src"]
reportGeneralTypeIssues = "none"
reportPropertyTypeMismatch = "none"
reportFunctionMemberAccess = "none"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportInvalidTypeForm = "none"
reportMissingTypeStubs = "none"
reportImportCycles = "none"
reportUnusedImport = "none"
reportUnusedClass = "none"
reportUnusedFunction = "none"
reportUnusedVariable = "none"
reportDuplicateImport = "none"
reportWildcardImportFromLibrary = "none"
reportAbstractUsage = "none"
reportArgumentType = "none"
reportAssertTypeFailure = "none"
reportAssignmentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportInconsistentOverload = "none"
reportIndexIssue = "none"
reportInvalidTypeArguments = "none"
reportNoOverloadImplementation = "none"
reportOperatorIssue = "none"
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportOptionalCall = "none"
reportOptionalIterable = "none"
reportOptionalContextManager = "none"
reportOptionalOperand = "none"
reportRedeclaration = "none"
reportReturnType = "none"
reportTypedDictNotRequiredAccess = "none"
reportUntypedFunctionDecorator = "none"
reportUntypedClassDecorator = "none"
reportUntypedBaseClass = "none"
reportUntypedNamedTuple = "none"
reportPrivateUsage = "none"
reportTypeCommentUsage = "none"
reportPrivateImportUsage = "none"
reportConstantRedefinition = "none"
reportDeprecated = "none"
reportIncompatibleMethodOverride = "none"
reportIncompatibleVariableOverride = "none"
reportInconsistentConstructor = "none"
reportOverlappingOverload = "none"
reportPossiblyUnboundVariable = "none"
reportMissingSuperCall = "none"
reportUninitializedInstanceVariable = "none"
reportInvalidStringEscapeSequence = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportInvalidTypeVarUse = "none"
reportCallInDefaultInitializer = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryCast = "none"
reportUnnecessaryComparison = "none"
reportUnnecessaryContains = "none"
reportAssertAlwaysTrue = "none"
reportSelfClsParameterName = "none"
reportImplicitStringConcatenation = "none"
reportUndefinedVariable = "none"
reportUnhashable = "none"
reportUnboundVariable = "none"
reportInvalidStubStatement = "none"
reportIncompleteStub = "none"
reportUnsupportedDunderAll = "none"
reportUnusedCallResult = "none"
reportUnusedCoroutine = "none"
reportUnusedExcept = "none"
reportUnusedExpression = "none"
reportUnnecessaryTypeIgnoreComment = "none"
reportMatchNotExhaustive = "none"
reportUnreachable = "none"
reportImplicitOverride = "none"
reportAny = "none"
reportExplicitAny = "none"
reportIgnoreCommentWithoutRule = "none"
reportInvalidCast = "none"
reportImplicitRelativeImport = "none"
reportPrivateLocalImportUsage = "none"
reportUnsafeMultipleInheritance = "none"
reportUnusedParameter = "none"
reportImplicitAbstractClass = "none"
reportUnannotatedClassAttribute = "none"
reportIncompatibleUnannotatedOverride = "none"
reportInvalidAbstractMethod = "none"
reportSelfClsDefault = "none"

[tool.ruff]
line-length = 140
indent-width = 4
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Start small and keep it actionable. We'll expand the ruleset once the baseline
# is clean and the team is ready to tighten the gate.
select = ["F", "E", "W", "UP", "B", "C4", "PIE"]
ignore = [
  # FastAPI's `Depends(...)` is designed to be used in parameter defaults.
  "B008",
]
