[project]
name = "crystalith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "straydragon", email = "straydragonl@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "cl-fastapix",
    "cl-pydanticx",
    "cl-sqlalchemyx",
    "cl-stdx",
    "fastapi>=0.117.1",
    "httpx>=0.27.0",
    "ollama>=0.3.3",
    "openai>=1.40.0",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.2",
    "scalar-fastapi>=1.6.0",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cl-fastapix = { workspace = true }
cl-pydanticx = { workspace = true }
cl-sqlalchemyx = { workspace = true }
cl-stdx = { workspace = true }

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "jinja2sql>=0.3.4",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
