# Pre-commit configuration for v2 (Bun + TypeScript)
# Install: pip install pre-commit && pre-commit install
# (pre-commit itself is still Python; hooks are Bun/TS)

repos:
  # Frontend checks
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend Lint (incremental)
        entry: bash -c 'cd frontend/web && pnpm run lint'
        language: system
        files: ^frontend/web/src/
        pass_filenames: false
        stages: [pre-commit]

      - id: frontend-format-check
        name: Frontend Format Check
        entry: bash -c 'cd frontend/web && pnpm run format:check'
        language: system
        files: ^frontend/web/src/
        pass_filenames: false
        stages: [pre-commit]

      - id: frontend-typecheck
        name: Frontend Typecheck
        entry: bash -c 'cd frontend/web && pnpm run typecheck'
        language: system
        files: ^frontend/web/src/
        pass_filenames: false
        stages: [pre-commit]

  # TODO: Enable when v2 server scaffold is ready
  # - repo: local
  #   hooks:
  #     - id: server-lint
  #       name: Server Lint
  #       entry: bash -c 'cd server && bun run lint'
  #       language: system
  #       files: ^server/src/
  #       pass_filenames: false
  #       stages: [pre-commit]
  #     - id: server-typecheck
  #       name: Server Typecheck
  #       entry: bash -c 'cd server && bun run typecheck'
  #       language: system
  #       files: ^server/src/
  #       pass_filenames: false
  #       stages: [pre-commit]

  # Standard hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
