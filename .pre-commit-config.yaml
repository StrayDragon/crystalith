# Pre-commit configuration for v2 (Bun + TypeScript)
# Install: pip install pre-commit && pre-commit install
# (pre-commit itself is still Python; hooks are Bun/TS)

repos:
  # Root-level oxlint + oxfmt (covers apps/server/ + packages/shared/ + apps/web/)
  - repo: local
    hooks:
      - id: lint
        name: oxlint
        entry: bun oxlint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: format-check
        name: oxfmt --check
        entry: bun oxfmt --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Standard hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
