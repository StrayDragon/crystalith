# Pre-commit configuration for v2 (Bun + TypeScript)
# Install: pip install pre-commit && pre-commit install
# (pre-commit itself is still Python; hooks are Bun/TS)

repos:
  # Root-level generated config drift detection
  - repo: local
    hooks:
      - id: check-env-examples
        name: Env examples match Zod SSOT
        entry: bun scripts/gen-env-examples.ts --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-app-schema
        name: app.schema.gen.json matches Zod schemas
        entry: bun scripts/gen-app-schema.ts --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Root-level oxlint + oxfmt (covers apps/server/ + packages/shared/ + apps/web/)
  - repo: local
    hooks:
      - id: lint
        name: oxlint
        entry: bun oxlint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: format
        name: oxfmt (auto-fix)
        entry: bun oxfmt --write
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Standard hygiene hooks
  # Exclude .agents/skills (vendored third-party skill docs) from fixing hooks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^\.agents/skills/'
      - id: end-of-file-fixer
        exclude: '^\.agents/skills/'
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
