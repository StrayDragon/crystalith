name: Feature request / 功能请求
description: Suggest an idea / 提出功能改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Clear problem statements help us scope and ship faster.

  - type: textarea
    id: problem
    attributes:
      label: Problem / 需求背景
      description: What problem are you trying to solve? Who is the user?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 方案建议
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 备选方案
      description: Any other approaches you considered.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / 验收标准
      description: What does “done” look like for this change?
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: checkboxes
    id: scope
    attributes:
      label: Scope / 范围
      options:
        - label: This may be a breaking change / 可能是破坏性变更
        - label: This affects the UI / 影响前端 UI
        - label: This affects the backend API / 影响后端 API
