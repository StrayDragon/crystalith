name: Bug report / 缺陷报告
description: Report a reproducible bug / 报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Security note: if this is a security issue, please follow SECURITY.md instead of filing a public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 发生了什么？
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望行为
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Please include minimal steps and sample data (if applicable).
    validations:
      required: true

  - type: dropdown
    id: environment-mode
    attributes:
      label: How are you running Crystalith? / 运行方式
      options:
        - Desktop app (Tauri)
        - CLI binary (crystalith-server)
        - Browser (web deployment)
        - Local dev (bun dev)
        - Other (please describe below)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The version tag or git commit hash you are running (if known).
      placeholder: e.g. v0.1.0 or c993095

  - type: textarea
    id: env-details
    attributes:
      label: Environment details / 环境信息
      description: OS, browser (if UI), Bun/Node versions, relevant config.
      placeholder: |
        OS:
        Browser:
        Bun:
        Notes:

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots / 相关日志
      description: Paste logs (redact secrets) or attach screenshots/GIFs if helpful.
      render: text
