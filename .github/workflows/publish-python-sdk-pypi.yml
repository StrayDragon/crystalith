name: Publish Python SDK to PyPI (deprecated)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Notice
        run: |
          echo "This workflow is deprecated."
          echo "Preferred: tag python/vX.Y.Z in crystalith-sdks to publish from the monorepo."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Checkout SDK monorepo submodule
        run: just sdk-submodule-update

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/py/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: python -m pip install -U uv

      - name: Sync backend dependencies (for schema export)
        run: |
          cd backend/py
          uv sync --frozen

      - name: Check OpenAPI schema is up to date
        run: just api-check

      - name: Check Python SDK version matches backend
        run: just sdk-version-check

      - name: Check tag matches version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BACKEND_VERSION="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("backend/py/pyproject.toml").read_text())["project"]["version"])')"
          if [[ "$TAG_VERSION" != "$BACKEND_VERSION" ]]; then
            echo "Tag/version mismatch: tag=$TAG_VERSION backend/py=$BACKEND_VERSION" >&2
            exit 1
          fi
          echo "Tag/version OK: $TAG_VERSION"

      - name: Build Python SDK (wheel/sdist)
        run: just sdk-build-python

      - name: Publish Python SDK to PyPI (Trusted Publisher)
        run: |
          cd vendor/crystalith-sdks/python
          uv publish --trusted-publishing always
