name: Release

# Tag-driven release (ship-server-binary design D2/D3):
#   push a `v*.*.*` tag → native matrix builds → per-target smoke (boot +
#   /health + one notebook write, per the D3 acceptance bar) → one GitHub
#   Release with all archives + sha256 sidecars.
#
# The version injected into the binary comes from the tag itself
# (git describe --exact-match inside scripts/build-release.ts), so the tag is
# the single version source.

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners so each artifact gets a real smoke test (design D3).
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          # Last Intel macOS image (macos-13 retired 2025-12; available until 2027-08)
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: win32-x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so `git describe --tags --exact-match` sees the release tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ matrix.target }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ matrix.target }}-

      - run: bun install --frozen-lockfile

      - run: bun scripts/build-release.ts

      - name: Smoke — boot, /health, create notebook
        shell: bash
        run: |
          set -euo pipefail
          cd target/release/stage/crystalith-server-*/
          BIN="$(ls crystalith-server* | head -n1)"
          CL_CHAT_MODEL=smoke CL_CHAT_API_BASE=http://127.0.0.1:9/v1 CL_SERVER_PORT=18099 "./$BIN" > server-smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          # Windows runners may spend ~30s in Defender's first-run scan of the
          # fresh unsigned binary — allow up to 60s before giving up.
          ok=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18099/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "— server did not become healthy within 60s; log:"
            cat server-smoke.log
            exit 1
          fi
          echo "— /health:"
          curl -sf http://127.0.0.1:18099/health
          echo
          echo "— create notebook (migrations + sqlite-vec):"
          curl -sf -X POST http://127.0.0.1:18099/v2/notebooks \
            -H 'Content-Type: application/json' -d '{"name":"ci-smoke"}'
          echo

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            target/release/*.tar.gz
            target/release/*.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v2.0.0-pre) publish as prereleases.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then FLAGS="--prerelease"; fi
          cat > release-notes.md <<'EOF'
          自托管单二进制发布。压缩包 = `crystalith-server` + `web/dist` + `drizzle` + `native` + `config`，解压后 `CL_CHAT_MODEL=… ./crystalith-server` 即可运行（详见 README「部署」）。

          _windows 产物为实验性（未签名，首次运行可能被 SmartScreen 提示）。_
          EOF
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes ${FLAGS:-}
