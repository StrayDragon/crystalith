name: Release Python SDK

on:
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version (x.y.z) expected in sdk/client/python/pyproject.toml'
        required: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set SDK version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify SDK version matches input
        env:
          SDK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - << 'PY'
          import re
          from pathlib import Path
          import os

          expected = os.environ["SDK_VERSION"]
          backend_pyproject = Path("backend/py/pyproject.toml")
          pyproject = Path("sdk/client/python/pyproject.toml")
          if not backend_pyproject.exists():
            raise SystemExit("backend/py/pyproject.toml not found")
          if not pyproject.exists():
            raise SystemExit("sdk/client/python/pyproject.toml not found")
          backend_data = backend_pyproject.read_text()
          data = pyproject.read_text()
          backend_match = re.search(r'^version\\s*=\\s*\"([^\"]+)\"', backend_data, re.MULTILINE)
          match = re.search(r'^version\\s*=\\s*\"([^\"]+)\"', data, re.MULTILINE)
          if not backend_match:
            raise SystemExit("version not found in backend/py/pyproject.toml")
          if not match:
            raise SystemExit("version not found in sdk/client/python/pyproject.toml")
          backend_version = backend_match.group(1)
          version = match.group(1)
          if backend_version != expected:
            raise SystemExit(
              f"Backend version mismatch: expected {expected}, got {backend_version}"
            )
          if version != expected:
            raise SystemExit(f"SDK version mismatch: expected {expected}, got {version}")
          print(f\"SDK version verified: {version}\")
          PY

      - name: Build dist
        run: |
          cd sdk/client/python
          python -m pip install -U uv
          uv build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/client/python/dist
        continue-on-error: true

      - name: Publish to PyPI (API token fallback)
        if: failure()
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: sdk/client/python/dist
