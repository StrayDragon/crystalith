name: Release Python SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version (must match backend/py/pyproject.toml)"
        required: true
        type: string
      dry_run:
        description: "Build only (skip publish)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  release-python-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/py/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: python -m pip install -U uv

      - name: Sync backend dependencies
        run: |
          cd backend/py
          uv sync --frozen

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Fern CLI
        run: npm install -g fern-api@3.73.1

      - name: Check OpenAPI schema is up to date
        run: just api-check

      - name: SDK freshness check (generate and verify no diff)
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          just sdk-gen-python VERSION="${{ inputs.version }}"
          git diff --exit-code -- sdk/client/python

      - name: Build PyPI package
        run: |
          rm -rf .tmp/pypi-python-sdk
          mkdir -p .tmp/pypi-python-sdk/src
          cp -R sdk/client/python .tmp/pypi-python-sdk/src/crystalith
          cp LICENSE .tmp/pypi-python-sdk/LICENSE
          cat > .tmp/pypi-python-sdk/README.md <<'EOF'
          # crystalith

          This package is generated from the Crystalith OpenAPI schema.
          EOF
          cat > .tmp/pypi-python-sdk/pyproject.toml <<'EOF'
          [build-system]
          requires = ["hatchling>=1.24.2"]
          build-backend = "hatchling.build"

          [project]
          name = "crystalith"
          dynamic = ["version"]
          description = "Crystalith Python SDK"
          readme = "README.md"
          requires-python = ">=3.10"
          license = { file = "LICENSE" }
          dependencies = [
            "httpx>=0.23.0",
            "pydantic>=1.10.0",
            "typing-extensions>=4.0.0",
          ]

          [project.urls]
          Repository = "https://github.com/StrayDragon/crystalith"

          [tool.hatch.version]
          path = "src/crystalith/.sdk-version"

          [tool.hatch.build.targets.wheel]
          packages = ["src/crystalith"]
          EOF
          python -m pip install -U build
          python -m build .tmp/pypi-python-sdk

      - name: Publish to PyPI (Trusted Publishing)
        if: ${{ (inputs.dry_run == false || inputs.dry_run == 'false' || inputs.dry_run == '') && secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: .tmp/pypi-python-sdk/dist

      - name: Publish to PyPI (API token fallback)
        if: ${{ (inputs.dry_run == false || inputs.dry_run == 'false' || inputs.dry_run == '') && secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: .tmp/pypi-python-sdk/dist
