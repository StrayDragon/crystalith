name: Check TypeScript SDK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-typescript-sdk.yml"
      - ".gitmodules"
      - "backend/py/**"
      - "frontend/web/openapi.gen.json"
      - "justfile"
      - "vendor/crystalith-sdks"
  pull_request:
    paths:
      - ".github/workflows/check-typescript-sdk.yml"
      - ".gitmodules"
      - "backend/py/**"
      - "frontend/web/openapi.gen.json"
      - "justfile"
      - "vendor/crystalith-sdks"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Checkout SDK monorepo submodule
        run: just sdk-submodule-update

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.29.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: vendor/crystalith-sdks/typescript/pnpm-lock.yaml

      - name: Check SDK versions match backend
        run: just sdk-version-check

      - name: Check TypeScript SDK is up to date
        run: just sdk-check-typescript

      - name: Build TypeScript SDK (dist + types)
        run: just sdk-build-typescript
