name: CI

on:
  push:
    branches: [v2-dev, main]
  pull_request:
    branches: [v2-dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch default branch (for incremental lint)
        run: git fetch origin v2-dev --depth=1

      # TODO: switch to bun after frontend pnpm→bun migration
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.29.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd frontend/web
          pnpm install --frozen-lockfile

      - name: Lint (incremental)
        run: |
          cd frontend/web
          bun run lint

      - name: Format check
        run: |
          cd frontend/web
          bun run format:check

      - name: Typecheck
        run: |
          cd frontend/web
          bun run typecheck

      - name: Test
        run: |
          cd frontend/web
          bun run test:ci

      - name: Build
        run: |
          cd frontend/web
          bun run build

