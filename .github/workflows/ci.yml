name: CI

# Test-acceptance gate — the CI equivalent of `just qa` (see justfile).
# All checks invoke `just` recipes so commands are SSOT with the local
# toolchain (bun/node versions pinned by .bun-version / .node-version).
# e2e is fully mocked (mock-openai-gateway, isolated ports/DB) and needs no
# network or LLM keys.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Static checks (typecheck / lint / format / drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # 与本地开发环境保持同一版本(单一来源: .bun-version / .node-version)
          bun-version-file: .bun-version

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # SSOT: 都调 just 配方(定义在 justfile, 与本地完全一致)
      - run: just check
      - run: just check-env-examples
      - run: just check-app-schema
      - run: just check-i18n-keys
      - run: just check-provider-deps

  test:
    name: Tests (server / shared / web / e2e @p0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'e2e/package.json') }}

      - run: bun install --frozen-lockfile

      # SSOT: 都调 just 配方(定义在 justfile, 与本地完全一致)
      - run: just test
      - run: just test-bdd
      - run: just test-web

      # Playwright 浏览器引导(just e2e 不负责装浏览器; 与本地 e2e-install
      # 等价, 但 CI 需 --with-deps 装系统依赖)
      - run: bunx playwright install --with-deps chromium
        working-directory: e2e
      # Use the Playwright chromium above, not the runner's system Chrome
      # (playwright.config channels to `chrome` unless this is '0').
      - run: just e2e
        env:
          CL_E2E_USE_SYSTEM_CHROME: '0'
