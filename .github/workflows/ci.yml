name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "openspec/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "openspec/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/py/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: python -m pip install -U uv

      - name: Sync dependencies
        run: |
          cd backend/py
          uv sync --frozen

      - name: Run backend tests
        run: |
          cd backend/py
          uv run pytest tests/ -v

      - name: Run offline LLM eval regression (non-blocking)
        run: |
          cd backend/py
          uv run python scripts/llm_eval.py --output-dir llm_eval_reports

      - name: Upload LLM eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-report
          path: backend/py/llm_eval_reports

      - name: Run workspace package tests
        run: |
          cd backend/py
          for package in packages/*; do
            # Run each package from its own root so package config (and coverage config)
            # is isolated from backend/py defaults.
            (
              cd "$package"
              uv run --project . pytest -c pyproject.toml -o asyncio_mode=auto
            )
          done

      - name: Check OpenAPI schema is up to date
        run: |
          cd backend/py
          uv run scripts/api_schema.py check -s ../../frontend/web/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.29.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd frontend/web
          pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          cd frontend/web
          pnpm test

      - name: Typecheck
        run: |
          cd frontend/web
          pnpm run typecheck

      - name: Build
        run: |
          cd frontend/web
          pnpm run build

      - name: Check generated API client is up to date
        run: |
          cd frontend/web
          pnpm run api:generate
          git diff --exit-code -- src/api/generated
