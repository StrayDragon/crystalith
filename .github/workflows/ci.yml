name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "openspec/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "openspec/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/py/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: python -m pip install -U uv

      - name: Sync dependencies
        run: |
          cd backend/py
          uv sync --frozen

      - name: Run backend tests
        run: |
          cd backend/py
          uv run pytest tests/ -v

      - name: Run workspace package tests
        run: |
          cd backend/py
          for package in packages/*; do
            uv run --project "$package" pytest "$package/tests"
          done

      - name: Check OpenAPI schema is up to date
        run: |
          cd backend/py
          uv run scripts/api_schema.py check -s ../../frontend/web/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.29.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd frontend/web
          pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          cd frontend/web
          pnpm test

      - name: Typecheck
        run: |
          cd frontend/web
          pnpm run typecheck

      - name: Build
        run: |
          cd frontend/web
          pnpm run build

      - name: Check generated API client is up to date
        run: |
          cd frontend/web
          pnpm run api:generate
          git diff --exit-code -- src/api/generated
