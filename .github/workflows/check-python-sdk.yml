name: Check Python SDK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-python-sdk.yml"
      - ".gitmodules"
      - "backend/py/**"
      - "frontend/web/openapi.json"
      - "justfile"
      - "sdk/configs/**"
      - "vendor/crystalith-sdks"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-python-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/py/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: python -m pip install -U uv

      - name: Sync backend dependencies
        run: |
          cd backend/py
          uv sync --frozen

      - name: Check OpenAPI schema is up to date
        run: just api-check

      - name: Check Python SDK version matches backend
        run: just sdk-version-check

      - name: Build Python SDK package (wheel/sdist)
        run: just sdk-build-python
