name: Check Python SDK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-python-sdk.yml"
      - "backend/py/**"
      - "frontend/web/openapi.json"
      - "justfile"
      - "sdk/client/python/**"
      - "sdk/configs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-python-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/py/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: python -m pip install -U uv

      - name: Sync backend dependencies
        run: |
          cd backend/py
          uv sync --frozen

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Fern CLI
        run: npm install -g fern-api@3.73.1

      - name: Check OpenAPI schema is up to date
        run: just api-check

      - name: Check Python SDK is up to date
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: just sdk-check

      - name: Build Python SDK package (wheel/sdist)
        run: just sdk-build-python
