name: Check Python SDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sdk:
    runs-on: ubuntu-latest
    env:
      SDK_PATH: sdk/client/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator
        run: |
          npm install -g fern-api@3.73.1

      - name: Export OpenAPI
        run: |
          cd backend/py
          python -m pip install -U uv
          uv sync
          uv run scripts/api_schema.py export -o ../../frontend/web/openapi.json

      - name: Generate SDK
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          ./scripts/sdk/generate_python_sdk.sh

      - name: Check for diff
        run: |
          git add "${SDK_PATH}"
          git diff --staged --exit-code
