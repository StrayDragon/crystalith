name: Check Python SDK

on:
  pull_request:
    paths:
      - 'backend/py/**'
      - 'frontend/web/openapi.json'
      - 'scripts/sdk/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  check-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install openapi-python-client

      - name: Export OpenAPI
        run: |
          cd backend/py
          python -m pip install -U uv
          uv sync
          uv run scripts/api_schema.py export -o ../../frontend/web/openapi.json

      - name: Generate SDK
        env:
          SDK_VERSION: 0.0.0
        run: |
          ./scripts/sdk/generate_python_sdk.sh

      - name: Check for diff
        run: |
          git add sdk/client/python
          git diff --staged --exit-code
