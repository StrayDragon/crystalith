server {
  listen 8080;
  server_name _;

  client_max_body_size 50m;

  # Docker embedded DNS — used for dynamic upstream resolution so Nginx
  # does not abort if a backend container is not yet ready at startup.
  resolver 127.0.0.11 valid=30s ipv6=off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  # ---- Backend API (Docker DNS: api) ----
  location /v1/ {
    proxy_pass http://api:8032;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE / streaming support
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location = /health {
    proxy_pass http://api:8032/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
  }

  # ---- Slidev preview (Docker DNS: slidev) ----
  # Dynamic resolution via variable so Nginx starts even if slidev is not up yet.
  # Rewrite strips the /slidev/ prefix before forwarding to the Slidev dev server.
  location /slidev/ {
    set $slidev_backend http://slidev:3030;
    rewrite ^/slidev/(.*) /$1 break;
    proxy_pass $slidev_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket support for Slidev HMR
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
