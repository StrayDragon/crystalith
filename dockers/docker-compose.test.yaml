services:
  postgres_test:
    image: postgres:18.1-trixie
    container_name: crystalith-postgres-test
    environment:
      POSTGRES_USER: crystalith
      POSTGRES_PASSWORD: crystalith
      POSTGRES_DB: crystalith_test
    ports:
      - "${CL_POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - postgres_test_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_test_data_18: {}
