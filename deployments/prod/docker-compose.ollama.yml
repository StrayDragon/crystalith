services:
  api:
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      CRYSTALITH_DEFAULT_CHAT_MODEL: ${CRYSTALITH_DEFAULT_CHAT_MODEL:-qwen-local}
      CRYSTALITH_DEFAULT_EMBEDDING_MODEL: ${CRYSTALITH_DEFAULT_EMBEDDING_MODEL:-bge-m3-local}
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: crystalith-ollama
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - frontend-net

volumes:
  ollamadata: {}
