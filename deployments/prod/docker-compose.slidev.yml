x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging-default

x-deploy-medium: &deploy-medium
  resources:
    limits:
      cpus: "1.00"
      memory: 1G

services:
  api:
    build:
      args:
        CRYSTALITH_BACKEND_EXTRAS: ${CRYSTALITH_BACKEND_EXTRAS:-official-slides}

  slidev:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: dockers/slidev/Dockerfile
      args:
        CI: ${CI:-}
        USE_CN_MIRROR: ${USE_CN_MIRROR:-1}
        NODE_IMAGE: ${NODE_IMAGE:-node:20-trixie-slim}
        PNPM_VERSION: ${PNPM_VERSION:-10.29.2}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: crystalith-slidev
    ports:
      - "${CL_SLIDEV_PORT:-3030}:3030"
    volumes:
      - ../../data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    deploy: *deploy-medium
    networks:
      - frontend-net
