x-healthcheck-default: &healthcheck-default
  interval: 10s
  timeout: 5s
  retries: 20

x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging-default

x-deploy-medium: &deploy-medium
  resources:
    limits:
      cpus: "1.00"
      memory: 1G

x-deploy-postgres: &deploy-postgres
  resources:
    limits:
      cpus: "1.00"
      memory: 1536M

services:
  api:
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-postgres:18.1-trixie}
    container_name: crystalith-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crystalith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crystalith}
      POSTGRES_DB: ${POSTGRES_DB:-crystalith}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
    deploy: *deploy-postgres
    networks:
      - backend-net

  chromadb:
    <<: *service-defaults
    image: ${CHROMADB_IMAGE:-chromadb/chroma:0.5.15}
    container_name: crystalith-chromadb
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/heartbeat')"]
    deploy: *deploy-medium
    networks:
      - backend-net

volumes:
  pgdata: {}
  chromadata: {}
