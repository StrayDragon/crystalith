x-healthcheck-default: &healthcheck-default
  interval: 10s
  timeout: 5s
  retries: 20

x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging-default
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-deploy-small: &deploy-small
  resources:
    limits:
      cpus: "0.50"
      memory: 256M

x-deploy-medium: &deploy-medium
  resources:
    limits:
      cpus: "1.00"
      memory: 1G

x-api-env: &api-env
  HOST: 0.0.0.0
  PORT: 8032
  RELOAD: "0"
  AUTO_DB_INIT: "1"
  CACHE_PROVIDER: ${CACHE_PROVIDER:-memory}
  REDIS_URL: ${REDIS_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OLLAMA_HOST: ${OLLAMA_HOST:-}
  CRYSTALITH_SEARCH__SEARXNG__HOST: ${CRYSTALITH_SEARCH__SEARXNG__HOST:-}
  CRYSTALITH_SEARCH__SEARXNG__API_KEY: ${CRYSTALITH_SEARCH__SEARXNG__API_KEY:-}
  CRYSTALITH_SEARCH__SEARXNG__TIMEOUT: ${CRYSTALITH_SEARCH__SEARXNG__TIMEOUT:-}
  CRYSTALITH_SEARCH__SEARXNG__MAX_RESULTS: ${CRYSTALITH_SEARCH__SEARXNG__MAX_RESULTS:-}
  CRYSTALITH_DEFAULT_CHAT_MODEL: ${CRYSTALITH_DEFAULT_CHAT_MODEL:-}
  CRYSTALITH_DEFAULT_EMBEDDING_MODEL: ${CRYSTALITH_DEFAULT_EMBEDDING_MODEL:-}
  CRYSTALITH_CONFIG_PATH: /app/config/app.yaml
  CRYSTALITH_SECRETS_PATH: ${CRYSTALITH_SECRETS_PATH:-}

services:
  # ---------------------------------------------------------------------------
  # Frontend (Nginx) — serves SPA + reverse-proxies API/optional Slidev
  # ---------------------------------------------------------------------------
  web:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: dockers/frontend/Dockerfile
      args:
        CI: ${CI:-}
        USE_CN_MIRROR: ${USE_CN_MIRROR:-1}
        NODE_IMAGE: ${NODE_IMAGE:-node:20-trixie-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29.5-trixie}
        PNPM_VERSION: ${PNPM_VERSION:-10.29.2}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: crystalith-web
    ports:
      - "${CL_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    deploy: *deploy-small
    networks:
      - frontend-net

  # ---------------------------------------------------------------------------
  # One-shot init: ensure shared data directory has correct permissions
  # ---------------------------------------------------------------------------
  data-init:
    image: ${ALPINE_IMAGE:-alpine:3.21}
    container_name: crystalith-data-init
    logging: *logging-default
    volumes:
      - ../../data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/output/preview
        chmod -R a+rw /data
        find /data -type d -exec chmod a+x {} \;
        echo "[data-init] Permissions fixed."
    restart: "no"

  # ---------------------------------------------------------------------------
  # Backend API (FastAPI) - core mode defaults to local sqlite/memory storage
  # ---------------------------------------------------------------------------
  api:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: dockers/backend/Dockerfile
      args:
        CI: ${CI:-}
        USE_CN_MIRROR: ${USE_CN_MIRROR:-1}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.10.2}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-trixie}
        APT_MIRROR: ${APT_MIRROR:-}
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    container_name: crystalith-api
    environment: *api-env
    volumes:
      - ../../data:/app/data
      - ../../config:/app/config:ro
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8032/health')"]
    deploy: *deploy-medium
    networks:
      - frontend-net
      - backend-net

networks:
  frontend-net: {}
  backend-net:
    internal: true
