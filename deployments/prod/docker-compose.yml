services:
  # ---------------------------------------------------------------------------
  # Frontend (Nginx) — serves SPA + reverse-proxies API/optional Slidev
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: dockers/frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-trixie-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29.5-trixie}
        PNPM_VERSION: ${PNPM_VERSION:-10.29.2}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: crystalith-web
    ports:
      - "${CL_WEB_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - frontend-net

  # ---------------------------------------------------------------------------
  # One-shot init: ensure shared data directory has correct permissions
  # ---------------------------------------------------------------------------
  data-init:
    image: ${ALPINE_IMAGE:-alpine:3.21}
    container_name: crystalith-data-init
    volumes:
      - ../../data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/output/preview
        chmod -R a+rw /data
        find /data -type d -exec chmod a+x {} \;
        echo "[data-init] Permissions fixed."
    restart: "no"

  # ---------------------------------------------------------------------------
  # Backend API (FastAPI) - core mode defaults to local sqlite/memory storage
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: dockers/backend/Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.10.2}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-trixie}
        APT_MIRROR: ${APT_MIRROR:-}
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    container_name: crystalith-api
    environment:
      HOST: 0.0.0.0
      PORT: 8032
      RELOAD: "0"
      AUTO_DB_INIT: "1"

      # Optional cache/provider/model overrides
      CACHE_PROVIDER: ${CACHE_PROVIDER:-memory}
      REDIS_URL: ${REDIS_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      CRYSTALITH_DEFAULT_CHAT_MODEL: ${CRYSTALITH_DEFAULT_CHAT_MODEL:-}
      CRYSTALITH_DEFAULT_EMBEDDING_MODEL: ${CRYSTALITH_DEFAULT_EMBEDDING_MODEL:-}

      # Config discovery in container
      CRYSTALITH_CONFIG_PATH: /app/config/app.yaml
      CRYSTALITH_SECRETS_PATH: ${CRYSTALITH_SECRETS_PATH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../data:/app/backend/py/data
      - ../../config:/app/config:ro
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8032/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    networks:
      - frontend-net
      - backend-net

networks:
  frontend-net: {}
  backend-net:
    internal: true
