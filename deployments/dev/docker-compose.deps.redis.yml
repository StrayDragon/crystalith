x-healthcheck-default: &healthcheck-default
  interval: 5s
  timeout: 5s
  retries: 20

x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging-default

services:
  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: crystalith-deps-redis
    ports:
      - "${CL_DEPS_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - deps-net

volumes:
  redisdata: {}

networks:
  deps-net: {}
