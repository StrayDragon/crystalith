x-healthcheck-default: &healthcheck-default
  interval: 10s
  timeout: 5s
  retries: 20

x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging-default

services:
  ollama:
    <<: *service-defaults
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: crystalith-deps-ollama
    ports:
      - "${CL_DEPS_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "ollama", "list"]
    networks:
      - deps-net

volumes:
  ollamadata: {}

networks:
  deps-net: {}
