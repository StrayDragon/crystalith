schema: spec-driven

context: |
  Tech stack:
  - Backend: FastAPI (Python) in backend/py/src/crystalith; tests in backend/py/tests; workspace libs in backend/py/packages.
  - Frontend: Vite + React + TypeScript in frontend/web/src.
  - Specs: canonical specs in openspec/specs; change workspaces in openspec/changes (archive in openspec/changes/archive).

  Commands (from repo root):
  - Backend: cd backend/py && uv sync; just dev; just test; just db-init; just config-schema; just packages-test; just llm-eval; just embedding-cache-bench.
  - Frontend: cd frontend/web && pnpm install; pnpm dev; pnpm test; pnpm typecheck; pnpm run build; pnpm run api:sync.

  Conventions:
  - Python: 4-space indentation; prefer type hints; snake_case functions/vars; PascalCase classes.
  - TypeScript/React: 2-space indentation; PascalCase components; hooks named useX.
  - CSS/Tailwind: global styles in frontend/web/src/app/index.css; feature styles alongside components.
  - No repo-wide formatter configured; match existing style and avoid unrelated reformatting.

  Testing:
  - Backend: pytest + pytest-asyncio.
  - Frontend: Vitest + React Testing Library.

  Git:
  - Commit prefixes: feat:, fix:, refactor:, doc:, dev:, misc: (optional scope like feat(backend):).

  Notes:
  - If backend OpenAPI changes, run frontend `pnpm run api:sync` and verify.
  - See openspec/AGENTS.md for spec/change workflow conventions.

